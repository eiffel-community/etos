# Isolated OpenTelemetry Collector used only by the e2e suite. It accepts OTLP gRPC for traces,
# metrics and logs. Traces and logs are retained in files for the lifetime of the test pod,
# independently of container log rotation. Images are pinned; bump them deliberately.
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-otel-collector
  namespace: etos-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: detailed
      debug/metrics:
        verbosity: normal
      file/traces:
        path: /telemetry/traces.json
      file/logs:
        path: /telemetry/logs.json
    service:
      telemetry:
        metrics:
          level: none
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug, file/traces]
        metrics:
          receivers: [otlp]
          exporters: [debug/metrics]
        logs:
          receivers: [otlp]
          exporters: [debug, file/logs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-otel-collector
  namespace: etos-system
  labels:
    app.kubernetes.io/name: e2e-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-otel-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.160.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            tcpSocket:
              port: 4317
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: telemetry
              mountPath: /telemetry
        - name: telemetry-reader
          image: busybox:1.37.0
          command: ["sleep", "infinity"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 8Mi
          volumeMounts:
            - name: telemetry
              mountPath: /telemetry
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: e2e-otel-collector
        - name: telemetry
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-otel-collector
  namespace: etos-system
spec:
  selector:
    app.kubernetes.io/name: e2e-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
