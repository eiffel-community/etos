apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: etos-api
  namespace: monitoring
  labels:
    etos-observability: "true"
spec:
  namespaceSelector:
    matchNames:
      - etos-test
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/part-of: etos
  endpoints:
    - port: http
      path: /metrics/
      scheme: http
