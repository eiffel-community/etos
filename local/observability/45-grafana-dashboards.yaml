apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: etos-health
        orgId: 1
        folder: ETOS
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etos-health-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  executive-overview.json: |
    {
      "schemaVersion": 39,
      "title": "ETOS Executive Overview",
      "uid": "etos-executive-overview",
      "tags": [
        "etos",
        "health",
        "p0"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "ETOS cluster",
            "description": "Namespace/Cluster CR name observed in labeled inventory. Single cluster only; unlabeled or unassigned telemetry is not selected. No choices means attribution is unavailable.",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(etos_inventory_resources{scope=\"cluster\",etos_cluster=~\".+/.+\"},etos_cluster)",
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "options": [],
            "current": {"text": "", "value": ""}
          }
        ]
      },
      "panels": [
        {
          "id": 15,
          "type": "stat",
          "title": "Overall ETOS health",
          "description": "0 = ✓ HEALTHY, 1 = ! DEGRADED, 2 = ? UNKNOWN. Domain checks use the selected ETOS cluster. Missing labeled API rates or overdue inventory, not-ready manager inventory, or down/absent API/collector scrapes mean UNKNOWN. Selected-cluster and shared infrastructure ETOS alerts both affect health; API/collector scrape checks and inventory readiness are manager/pipeline-wide, not per-cluster certification. HEALTHY is limited to these checks, not proof of end-to-end completeness. Query failures remain UNKNOWN.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(vector(2) and on() ((min(etos_inventory_leader_ready) != 1) or absent(etos_inventory_leader_ready) or absent(etos_inventory_snapshot_ready{scope=\"manager\"}) or absent(etos_inventory_testrun_overdue{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) or absent(sum(rate(etos_api_requests_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m]))) or (min(up{job=~\".+-etos-api\"}) != 1) or absent(up{job=~\".+-etos-api\"}) or (min(up{job=\"otel-collector\",endpoint=\"int-metrics\"}) != 1) or absent(up{job=\"otel-collector\",endpoint=\"int-metrics\"}))) or on() clamp_max((count(ALERTS{alertstate=\"firing\",alertname=~\"ETOS.*\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"} or ALERTS{alertstate=\"firing\",alertname=~\"ETOS.*\",etos_cluster=\"\"}) or vector(0)) + ((sum(rate(etos_api_requests_total{status_class=\"5xx\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])) or (0 * sum(rate(etos_api_requests_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])))) > bool 0) + (max(etos_inventory_testrun_overdue{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) > bool 0), 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ HEALTHY",
                      "color": "#2E7D32",
                      "index": 0
                    },
                    "1": {
                      "text": "! DEGRADED",
                      "color": "#C62828",
                      "index": 1
                    },
                    "2": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270",
                      "index": 2
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "displayName": "Overall ETOS health"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 72
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
          }
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Active test runs",
          "description": "Fresh current TestRuns excluding completed, failed, timed_out, aborted, cleanup_failed; includes completing and cleaning_up. Suppressed unless the single scraped leader has fresh inventory. A fresh empty snapshot is zero; stale/absent is UNKNOWN. No agreed count objective: neutral color, no count thresholds.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(max by (phase, scope) (etos_inventory_testrun_phase{scope=\"cluster\",phase!~\"completed|failed|timed_out|aborted|cleanup_failed\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"})) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "displayName": "Active test runs"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 56
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 6
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Server errors/sec",
          "description": "Selected ETOS cluster's canonical decorated API operation 5xx responses/sec over 5m, across all API versions. Zero is supported only by that cluster's labeled request-rate samples while every API scrape target is up. Absent cluster attribution is UNKNOWN, never a shared-target zero. API scrape gating is pipeline-wide. Any positive value indicates server errors; not a TestRun failure rate.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(sum(rate(etos_api_requests_total{status_class=\"5xx\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])) or on() (0 * sum(rate(etos_api_requests_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])))) and on() (min(up{job=~\".+-etos-api\"}) == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 3,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ 0",
                      "color": "#2E7D32",
                      "index": 0
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#C62828",
                    "value": null
                  }
                ]
              },
              "displayName": "Server errors/sec"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 56
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 8,
            "h": 6
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Telemetry",
          "description": "Shared pipeline, not ETOS-cluster scoped. Collector internal-metrics scrape only: 1 = ✓ Scrape OK, 0 = ! DOWN, absent = ? UNKNOWN. Does not certify signal completeness, export success, or client receipt.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "min(up{job=\"otel-collector\",endpoint=\"int-metrics\"})",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "✓ Scrape OK",
                      "color": "#2E7D32",
                      "index": 0
                    },
                    "0": {
                      "text": "! DOWN",
                      "color": "#C62828",
                      "index": 1
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "displayName": "Telemetry"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 48
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 16,
            "y": 7,
            "w": 8,
            "h": 6
          }
        },
        {
          "id": 17,
          "type": "stat",
          "title": "TestRun completions observed · 24h",
          "description": "Rolling 24h controller-observed terminal TestRuns, summed across manager streams and shown only while the controller-manager metrics scrape is healthy. This is an observation count, not a durable/event-time ledger; there is no backfill before instrumentation and the initial window is partial. Preinitialized zero counter series support a true zero after Prometheus has scraped them; early-start events before the first scrape can still be missed. Current retained-resource creation counts remain in TestRun Detail.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(increase(etos_testrun_finished_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) and on() (min(up{job=\"etos-controller-manager-metrics-service\",namespace=\"etos-system\"}) == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "displayName": "Completions observed · 24h"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 48
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 5,
            "h": 6
          }
        },
        {
          "id": 18,
          "type": "stat",
          "title": "ETOS failure rate · 24h",
          "description": "Operational failure rate: controller-observed `failure` + `timed_out` divided by all finished outcomes except `aborted`, over the rolling 24h. This uses persisted active/suite-runner operational evidence, never the test verdict. No eligible finishes displays No eligible finishes; an unhealthy or absent controller-manager scrape is UNKNOWN. The estimate is not backfilled before instrumentation; early-start events, scrape/export gaps and manager restarts can lose observations. Not an SLO or paging condition.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "((sum(increase(etos_testrun_finished_total{outcome=~\"failure|timed_out\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) / (sum(increase(etos_testrun_finished_total{outcome!=\"aborted\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) > 0)) or on() (-1 + 0 * (sum(increase(etos_testrun_finished_total{outcome!=\"aborted\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) == 0))) and on() (min(up{job=\"etos-controller-manager-metrics-service\",namespace=\"etos-system\"}) == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "No eligible finishes",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "displayName": "ETOS failure rate · 24h",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#1F77B4",
                    "value": null
                  },
                  {
                    "color": "#8A5700",
                    "value": 0.05000000000000001
                  },
                  {
                    "color": "#C62828",
                    "value": 0.20000000000000004
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 48
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 5,
            "y": 13,
            "w": 5,
            "h": 6
          }
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Environment provisioning p95 · 24h",
          "description": "Approximate p95 over the rolling 24h of controller-recorded EnvironmentRequest creation → successful Job completion durations. Prometheus buckets are summed across manager streams before quantile calculation. Shown only while the controller-manager metrics scrape is healthy; p95 remains absent when no successful observations exist. These observations do not backfill before instrumentation and can have startup/status-update, scrape, export, or manager-restart gaps; early-start events before the first scrape can be missed. Prometheus retains 1d locally. This is an investigation signal, not proof of failure or an approved SLO.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(histogram_quantile(0.95, sum by (le) (increase(etos_environment_request_duration_seconds_bucket{outcome=\"success\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h]))) and on() (sum(increase(etos_environment_request_duration_seconds_count{outcome=\"success\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) > 0)) and on() (min(up{job=\"etos-controller-manager-metrics-service\",namespace=\"etos-system\"}) == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": "successful EnvironmentRequests · p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "-2": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ],
              "displayName": "Environment provisioning p95 · 24h"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 48
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 10,
            "y": 13,
            "w": 5,
            "h": 6
          }
        },
        {
          "id": 20,
          "type": "stat",
          "title": "Oldest active run",
          "description": "Age since creation of the oldest unfinished, non-deleting TestRun. Fresh zero = None active. Stale/absent = UNKNOWN. No arbitrary duration threshold.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(etos_inventory_testrun_oldest_active_age_seconds{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 1,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "None active",
                      "color": "#1F77B4"
                    }
                  }
                }
              ],
              "displayName": "Oldest active run"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "horizontal",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 28,
              "valueSize": 48
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 15,
            "y": 13,
            "w": 5,
            "h": 6
          }
        },
        {
          "id": 21,
          "type": "stat",
          "title": "Overdue runs",
          "description": "Selected cluster's unfinished TestRuns past spec.deadline. ✓ 0 only with a fresh explicit labeled zero; positive values show ! N. Any overdue run degrades the verdict immediately; provisional warning alert waits 10m. Absent attribution means UNKNOWN here and in the overall verdict. Freshness is manager-wide.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max(etos_inventory_testrun_overdue{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": ""
            }
          ],
