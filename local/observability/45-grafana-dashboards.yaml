  testrun-detail.json: |
    {
      "schemaVersion": 39,
      "title": "ETOS TestRun Detail",
      "uid": "etos-testrun-detail",
      "description": "Domain metrics filter the selected namespace/Cluster CR name. Unlabeled telemetry is UNKNOWN, not a cross-cluster fallback. Inventory freshness and controller-manager scrape guards remain explicitly manager-wide; API version applies only to API panels.",
      "links": [
        {"title": "ETOS overview", "url": "/d/etos-executive-overview?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true},
        {"title": "Single TestRun (exact ID)", "url": "/d/etos-single-testrun?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true}
      ],
      "tags": [
        "etos",
        "testrun",
        "p0"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "ETOS cluster",
            "description": "Namespace/Cluster CR name observed in labeled inventory. Single cluster only; unlabeled or unassigned telemetry is not selected. No choices means attribution is unavailable.",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(etos_inventory_resources{scope=\"cluster\",etos_cluster=~\".+/.+\"},etos_cluster)",
            "refresh": 1,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "options": [],
            "current": {"text": "", "value": ""}
          },
          {
            "name": "api_version",
            "type": "custom",
            "query": "v1beta1,v1alpha",
            "current": {
              "text": "v1beta1",
              "value": "v1beta1"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "API request rate by operation",
          "description": "Admission activity by explicit API version. Individual run identifiers are intentionally not metric dimensions.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (operation) (rate(etos_api_requests_total{api_version=\"$api_version\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m]))",
              "legendFormat": "{{operation}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "API p95 latency",
          "description": "Request latency in seconds. Insufficient samples are not rendered as zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le,operation) (rate(etos_api_request_duration_seconds_bucket{api_version=\"$api_version\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])))",
              "legendFormat": "{{operation}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          }
        },
        {
          "id": 3,
          "type": "table",
          "title": "Inventory freshness · manager-wide",
          "description": "Shared manager snapshot readiness and age, deliberately not ETOS-cluster scoped. Readiness requires one scraped leader with a fresh complete snapshot; it does not prove that the selected cluster has labeled domain telemetry. Unknown means current resource state cannot be established.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "etos_inventory_leader_ready and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "format": "table"
            },
            {
              "expr": "etos_inventory_snapshot_age_seconds{scope=\"manager\"} and on(job, instance) (up == 1)",
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 8
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Suite admission operations",
          "description": "Suite download and validation rates by API version and bounded outcome. URLs and suite identifiers are excluded.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (api_version, operation, outcome) (rate(etos_api_suite_operations_total{api_version=\"$api_version\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))",
              "legendFormat": "{{api_version}} / {{operation}} / {{outcome}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Current TestRun lifecycle phase",
          "description": "Current absolute phase counts reconstructed from persisted manager state. This is not a historical transition rate; show Unknown when the inventory snapshot is not ready.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (phase) (max by (phase, scope) (etos_inventory_testrun_phase{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"})) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 23
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Current TestRun status",
          "description": "Absolute current-state verdict and operational conclusion counts. These are bounded categories, not historical totals; show Unknown when the inventory snapshot is not ready.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum by (verdict) (max by (verdict, scope) (etos_inventory_testrun_verdict{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"})) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "format": "table",
              "legendFormat": "verdict: {{verdict}}"
            },
            {
              "expr": "sum by (operational_conclusion) (max by (operational_conclusion, scope) (etos_inventory_testrun_operational_conclusion{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"})) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "format": "table",
              "legendFormat": "conclusion: {{operational_conclusion}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 31
          }
        },
        {
          "id": 7,
          "type": "text",
          "title": "Version comparison and data boundaries",
          "description": "Backend-neutral interpretation rules for operators.",
          "options": {
            "mode": "markdown",
            "content": "### Selected ETOS cluster / API version\nThe cluster selector filters every domain metric before aggregation, including histogram buckets and counts. The API-version selector filters API panels only. Inventory readiness, controller-manager scrapes and shared pipeline health remain manager-wide, not cluster certification. Missing canonical cluster labels mean Unknown; no old cross-cluster fallback is used. Created counts remain retained-resource gauges and can be lower bounds when objects have been deleted. Finished counts and duration quantiles are controller observations, not durable/backfilled event ledgers. Histogram quantiles are approximate; scrape gaps and restarts can lose observations. TestRun IDs belong in traces/logs, never metric labels."
          },
          "gridPos": {
            "x": 0,
            "y": 39,
            "w": 24,
            "h": 7
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Created vs finished · rolling windows",
          "description": "Created counts are retained-resource gauges for 1h and 24h and remain lower bounds when the matching window completeness gauge is 0; stale inventory is UNKNOWN. Finished counts are controller-observed outcomes in the rolling 24h, summed across manager streams and shown only while the controller-manager metrics scrape is healthy. They are not event-time gauges, are not backfilled before instrumentation, and the initial observation window is partial. A zero is meaningful after Prometheus has scraped the preinitialized controller counter series; early-start events before the first scrape can be missed. TestRun operational outcomes are distinct from test verdicts.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "label_replace((max by (window) (etos_inventory_testrun_created{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}), \"operational_conclusion\", \"created\", \"\", \"\") or label_replace(label_replace((sum by (outcome) (increase(etos_testrun_finished_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) and on() (min(up{job=\"etos-controller-manager-metrics-service\",namespace=\"etos-system\"}) == 1)), \"operational_conclusion\", \"$1\", \"outcome\", \"(.*)\"), \"window\", \"24h\", \"\", \"\")",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": "{{window}} · {{operational_conclusion}}",
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 46,
            "w": 12,
            "h": 7
          },
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "window",
                    "operational_conclusion",
                    "Value"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "window": "Window",
                  "operational_conclusion": "Created / finish outcome",
                  "Value": "Count / observations"
                }
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "TestRun duration quantiles · 1h / 24h",
          "description": "Approximate p50 and p95 creation-to-terminal-status durations from controller-recorded histogram observations. Buckets are summed across manager streams before quantile calculation; they are not averages of per-manager quantiles. The outcome dimension is a bounded operational classification, distinct from test verdict. Queries are shown only while the controller-manager metrics scrape is healthy. Rolling windows do not backfill before instrumentation and the initial 24h is partial; early-start events before the first scrape, scrape/export gaps and controller restarts can lose observations.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "(label_replace(label_replace((histogram_quantile(0.50, sum by (le, outcome) (increase(etos_testrun_duration_seconds_bucket{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[1h]))) and on (outcome) (sum by (outcome) (increase(etos_testrun_duration_seconds_count{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[1h])) > 0)), \"window\", \"1h\", \"\", \"\"), \"quantile\", \"0.5\", \"\", \"\") or label_replace(label_replace((histogram_quantile(0.95, sum by (le, outcome) (increase(etos_testrun_duration_seconds_bucket{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[1h]))) and on (outcome) (sum by (outcome) (increase(etos_testrun_duration_seconds_count{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[1h])) > 0)), \"window\", \"1h\", \"\", \"\"), \"quantile\", \"0.95\", \"\", \"\") or label_replace(label_replace((histogram_quantile(0.50, sum by (le, outcome) (increase(etos_testrun_duration_seconds_bucket{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h]))) and on (outcome) (sum by (outcome) (increase(etos_testrun_duration_seconds_count{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) > 0)), \"window\", \"24h\", \"\", \"\"), \"quantile\", \"0.5\", \"\", \"\") or label_replace(label_replace((histogram_quantile(0.95, sum by (le, outcome) (increase(etos_testrun_duration_seconds_bucket{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h]))) and on (outcome) (sum by (outcome) (increase(etos_testrun_duration_seconds_count{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[24h])) > 0)), \"window\", \"24h\", \"\", \"\"), \"quantile\", \"0.95\", \"\", \"\")) and on() (min(up{job=\"etos-controller-manager-metrics-service\",namespace=\"etos-system\"}) == 1)",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": "{{window}} · q{{quantile}}",
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "noValue": "? UNKNOWN · no observations or telemetry",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 12,
            "y": 46,
            "w": 8,
            "h": 7
          },
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "window",
                    "quantile",
                    "outcome",
                    "Value"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "window": "Window",
                  "quantile": "Quantile",
                  "outcome": "Outcome",
                  "Value": "Duration"
                }
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Created-count coverage · 1h / 24h",
          "description": "Applies only to retained-resource TestRun creation counts. 1 = retained resources appear to cover the requested window; this is not a completeness guarantee. 0 = known lower bound because older resources may have been deleted. This does not measure controller telemetry coverage and is not an event ledger. Stale/absent inventory is UNKNOWN.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "max by (window) (etos_inventory_testrun_window_complete{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": "{{window}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "? UNKNOWN",
              "color": {
                "mode": "fixed",
                "fixedColor": "#1F77B4"
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "? UNKNOWN",
                      "color": "#5A6270"
                    }
                  }
                },
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "≥ Lower bound",
                      "color": "#1F77B4"
                    },
                    "1": {
                      "text": "Appears covered",
                      "color": "#1F77B4"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "vertical",
            "textMode": "value_and_name",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "text": {
              "titleSize": 20,
              "valueSize": 28
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            },
            {
              "title": "Provider and delivery detail",
              "url": "/d/etos-provider-delivery?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 20,
            "y": 46,
            "w": 4,
            "h": 7
          }
        }
      ]
    }
  single-testrun.json: |
    {
      "schemaVersion": 39,
      "title": "ETOS Single TestRun",
      "uid": "etos-single-testrun",
      "tags": ["etos", "testrun", "logs", "traces"],
      "description": "Inspect one exact ETOS ID (API tercc / TestRun spec.id). Cluster selection is navigation context only: old logs/traces lack canonical cluster attribution and are not cluster-filtered. All evidence is correlated by the exact ID; reported suite results are not live Kubernetes status.",
      "time": {"from": "now-24h", "to": "now"},
      "refresh": "30s",
      "templating": {"list": [
        {"name": "cluster", "label": "ETOS cluster (navigation only)", "description": "Navigation context only; the Tempo ID dropdown and exact-ID logs/traces are not cluster-filtered. Old evidence can lack canonical cluster attribution.", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(etos_inventory_resources{scope=\"cluster\",etos_cluster=~\".+/.+\"},etos_cluster)", "refresh": 1, "sort": 1, "multi": false, "includeAll": false, "options": [], "current": {"text": "", "value": ""}},
        {
          "name": "testrun_id",
          "label": "TestRun ID (tercc)",
          "description": "Select an ID observed in recent Tempo traces, or paste an API tercc / TestRun spec.id. Tempo's native variable lookup is not scoped to the dashboard time range and may omit older retained runs. This is not the Kubernetes resource name.",
          "type": "query",
          "datasource": {"type": "tempo", "uid": "tempo"},
          "query": {"type": 1, "label": "etos.id", "refId": "TempoDatasourceVariableQueryEditor-VariableQuery"},
          "definition": "Label values: etos.id",
          "refresh": 1,
          "sort": 1,
          "regex": "/.+/",
          "multi": false,
          "includeAll": false,
          "options": [],
          "current": {"text": "", "value": ""},
          "hide": 0
        }
      ]},
      "links": [
        {"title": "ETOS overview", "url": "/d/etos-executive-overview?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true},
        {"title": "Aggregate TestRun health", "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true}
      ],
      "panels": [
        {
          "id": 1, "type": "text", "title": "Selected run and evidence",
          "description": "Cluster is navigation context only, not a filter or ownership assertion for these exact-ID logs/traces. The Tempo dropdown/manual ID workflow is unchanged.",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 4},
          "options": {"mode": "markdown", "content": "**TestRun ID:** `${testrun_id}` · **Cluster:** `${cluster}` (navigation only; does not filter old logs/traces or assert this ID's cluster)\n\nSelect a recently observed ID above, or paste an API `tercc` / Kubernetes `spec.id` into the dropdown search and press Enter. Reload the dashboard to refresh the choices. Tempo's native ID lookup is not scoped to cluster or dashboard time range and can omit older retained runs. Choose a time range covering the selected run. Click a trace's Span ID to open the full trace waterfall in Explore.\n\n**Unknown / No data is not success.** Results below are suite-runner reports in the selected window, not live Kubernetes status. Logs and traces may be incomplete or expired. Provisioning/release success is not a test verdict."}
        },
        {
          "id": 2, "type": "stat", "title": "Reported test verdict",
          "description": "Latest ESR result logged by the suite runner in the selected time range. Unknown until a result arrives, or if telemetry is unavailable. This does not certify current Kubernetes state.",
          "gridPos": {"x": 0, "y": 4, "w": 6, "h": 5},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{
            "refId": "A", "queryType": "range", "direction": "backward", "maxLines": 1000,
            "expr": "{service_name=\"etos-suite-runner\"} | json run=\"attributes.identifier\" | run=${testrun_id:doublequote} | run!=\"\" |= \"ESR result:\" | regexp \"verdict='(?P<verdict>[^']+)'\" | verdict!=\"\" | __error__=\"\" | line_format \"{{.verdict}}\""
          }],
          "transformations": [
            {"id": "sortBy", "options": {"sort": [{"field": "Time", "desc": false}]}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["Line"]}}},
            {"id": "reduce", "options": {"reducers": ["lastNotNull"]}}
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "/.*/", "values": false}, "textMode": "value", "colorMode": "background", "graphMode": "none"},
          "fieldConfig": {"defaults": {
            "noValue": "Unknown",
            "color": {"mode": "fixed", "fixedColor": "text"},
            "mappings": [
              {"type": "value", "options": {
                "Passed": {"text": "PASSED", "color": "green"},
                "Failed": {"text": "FAILED", "color": "red"},
                "Inconclusive": {"text": "INCONCLUSIVE", "color": "orange"},
                "None": {"text": "UNKNOWN", "color": "text"}
              }}
            ]
          }, "overrides": []}
        },
        {
          "id": 3, "type": "stat", "title": "Reported operational conclusion",
          "description": "Latest ESR operational conclusion, separate from the test verdict. A successfully executed test can still fail its assertions.",
          "gridPos": {"x": 6, "y": 4, "w": 6, "h": 5},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{
            "refId": "A", "queryType": "range", "direction": "backward", "maxLines": 1000,
            "expr": "{service_name=\"etos-suite-runner\"} | json run=\"attributes.identifier\" | run=${testrun_id:doublequote} | run!=\"\" |= \"ESR result:\" | regexp \"conclusion='(?P<conclusion>[^']+)'\" | conclusion!=\"\" | __error__=\"\" | line_format \"{{.conclusion}}\""
          }],
          "transformations": [
            {"id": "sortBy", "options": {"sort": [{"field": "Time", "desc": false}]}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["Line"]}}},
            {"id": "reduce", "options": {"reducers": ["lastNotNull"]}}
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "/.*/", "values": false}, "textMode": "value", "colorMode": "background", "graphMode": "none"},
          "fieldConfig": {"defaults": {
            "noValue": "Unknown",
            "color": {"mode": "fixed", "fixedColor": "text"},
            "mappings": [{"type": "value", "options": {
              "Successful": {"text": "SUCCESSFUL", "color": "green"},
              "Failed": {"text": "FAILED", "color": "red"},
              "TimedOut": {"text": "TIMED OUT", "color": "orange"},
              "Aborted": {"text": "ABORTED", "color": "orange"},
              "Inconclusive": {"text": "INCONCLUSIVE", "color": "orange"}
            }}]
          }, "overrides": []}
        },
        {
          "id": 4, "type": "stat", "title": "Last reported suite-runner activity",
          "description": "Latest correlated suite-runner log message in the selected window, not a current-state or liveness check.",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 5},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{
            "refId": "A", "queryType": "range", "direction": "backward", "maxLines": 1000,
            "expr": "{service_name=\"etos-suite-runner\"} | json run=\"attributes.identifier\", log_body=\"body\" | run=${testrun_id:doublequote} | run!=\"\" | __error__=\"\" !~ \"(?i)(token|authorization|password|secret)\" | line_format \"{{ $entry := fromJson .log_body }}{{ if $entry }}{{ $entry.message }}{{ else }}{{ .log_body }}{{ end }}\""
          }],
          "transformations": [
            {"id": "sortBy", "options": {"sort": [{"field": "Time", "desc": false}]}},
            {"id": "filterFieldsByName", "options": {"include": {"names": ["Line"]}}},
            {"id": "reduce", "options": {"reducers": ["lastNotNull"]}}
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "/.*/", "values": false}, "textMode": "value", "colorMode": "none", "graphMode": "none"},
          "fieldConfig": {"defaults": {"noValue": "Unknown"}, "overrides": []}
        },
        {
          "id": 5, "type": "table", "title": "Run information and traces",
          "description": "Matching start spans expose API version, artifact and suite source. Click Span ID for the full trace. Start-span duration measures submission, not end-to-end execution. Tempo search summaries may lag; the opened trace is the detailed view.",
          "gridPos": {"x": 0, "y": 9, "w": 24, "h": 8},
          "datasource": {"type": "tempo", "uid": "tempo"},
          "targets": [{
            "refId": "A", "queryType": "traceql", "tableType": "spans", "limit": 20, "spss": 20,
            "query": "{span.\"etos.id\"=${testrun_id:doublequote} && span.\"etos.id\"!=\"\"} | select(span.\"etos.version\", span.\"etos.artifact.id\", span.\"etos.artifact.identity\", span.\"etos.test_suite.uri\")"
          }],
          "options": {"showHeader": true, "cellHeight": "sm"},
          "fieldConfig": {"defaults": {"noValue": "Unknown"}, "overrides": []}
        },
        {
          "id": 6, "type": "logs", "title": "Provider provisioning and release",
          "description": "Correlated provider activity, including provisioning and release. These are observed messages, not proof that every resource was cleaned up. Use the full trace waterfall for span timings; Tempo search can return only a subset of an asynchronous trace.",
          "gridPos": {"x": 0, "y": 17, "w": 24, "h": 9},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{
            "refId": "A", "queryType": "range", "direction": "forward", "maxLines": 1000,
            "expr": "{service_name=~\".+/.+\"} | json run=\"attributes.identifier\", log_body=\"body\" | run=${testrun_id:doublequote} | run!=\"\" | __error__=\"\" !~ \"(?i)(token|authorization|password|secret)\" | log_body!=\"Request Body\" | log_body!=\"Response Body\" | line_format \"{{.log_body}}\""
          }],
          "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "prettifyLogMessage": false, "enableLogDetails": true, "sortOrder": "Ascending", "dedupStrategy": "none"},
          "fieldConfig": {"defaults": {}, "overrides": []}
        },
        {
          "id": 7, "type": "logs", "title": "Reported results and lifecycle",
          "description": "Suite-runner milestones and result descriptions for this ID. No logs does not mean the run passed or is still running.",
          "gridPos": {"x": 0, "y": 26, "w": 24, "h": 10},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{
            "refId": "A", "queryType": "range", "direction": "forward", "maxLines": 1000,
            "expr": "{service_name=\"etos-suite-runner\"} | json run=\"attributes.identifier\", log_body=\"body\" | run=${testrun_id:doublequote} | run!=\"\" | __error__=\"\" !~ \"(?i)(token|authorization|password|secret)\" | line_format \"{{ $entry := fromJson .log_body }}{{ if $entry }}{{ $entry.message }}{{ else }}{{ .log_body }}{{ end }}\""
          }],
          "options": {"showTime": true, "showLabels": false, "showCommonLabels": false, "wrapLogMessage": true, "prettifyLogMessage": false, "enableLogDetails": true, "sortOrder": "Ascending", "dedupStrategy": "none"},
          "fieldConfig": {"defaults": {}, "overrides": []}
        },
        {
          "id": 8, "type": "logs", "title": "Correlated logs - all available services",
          "description": "Exact match on attributes.identifier, shared by the API, suite runner and providers. Messages are normalized; credential-related lines and request/response payload dumps are omitted. This is not a security boundary or a complete audit log. Up to 2000 latest entries in the selected window. Test-runner/controller logs without this identifier are not included.",
          "gridPos": {"x": 0, "y": 36, "w": 24, "h": 16},
          "datasource": {"type": "loki", "uid": "loki"},
          "targets": [{
            "refId": "A", "queryType": "range", "direction": "backward", "maxLines": 2000,
            "expr": "{service_name=~\".+\"} | json run=\"attributes.identifier\", log_body=\"body\" | run=${testrun_id:doublequote} | run!=\"\" | __error__=\"\" !~ \"(?i)(token|authorization|password|secret)\" | log_body!=\"Request Body\" | log_body!=\"Response Body\" | line_format \"{{ $entry := fromJson .log_body }}{{ if $entry }}{{ $entry.message }}{{ else }}{{ .log_body }}{{ end }}\""
          }],
          "options": {"showTime": true, "showLabels": true, "showCommonLabels": false, "wrapLogMessage": true, "prettifyLogMessage": false, "enableLogDetails": true, "sortOrder": "Ascending", "dedupStrategy": "none"},
          "fieldConfig": {"defaults": {}, "overrides": []}
        }
      ]
    }
  provider-delivery.json: |
    {
      "schemaVersion": 39,
      "title": "ETOS Provider and Delivery",
      "uid": "etos-provider-delivery",
      "description": "Domain metrics use the selected namespace/Cluster CR name; absent canonical cluster labels mean UNKNOWN, not zero or an unfiltered fallback. Collector, controller-runtime and scrape health remain shared infrastructure scope, independent of the selector. API version is not a delivery/inventory dimension.",
      "links": [
        {"title": "ETOS overview", "url": "/d/etos-executive-overview?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true},
        {"title": "TestRun detail", "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true},
        {"title": "Single TestRun (exact ID)", "url": "/d/etos-single-testrun?var-cluster=${cluster:percentencode}", "type": "link", "keepTime": true}
      ],
      "tags": ["etos", "delivery", "p1"],
      "time": {"from": "now-6h", "to": "now"},
      "templating": {"list": [
        {"name": "api_version", "type": "custom", "query": "v1beta1,v1alpha", "current": {"text": "v1beta1", "value": "v1beta1"}},
        {"name": "cluster", "label": "ETOS cluster", "description": "Namespace/Cluster CR name observed in labeled inventory. Single cluster only; unlabeled or unassigned telemetry is not selected. No choices means attribution is unavailable.", "type": "query", "datasource": {"type": "prometheus", "uid": "prometheus"}, "query": "label_values(etos_inventory_resources{scope=\"cluster\",etos_cluster=~\".+/.+\"},etos_cluster)", "refresh": 1, "sort": 1, "multi": false, "includeAll": false, "options": [], "current": {"text": "", "value": ""}}
      ]},
      "panels": [
        {"id": 1, "type": "stat", "title": "Telemetry integrity · shared pipeline", "description": "Shared collector scrape freshness, not ETOS-cluster scoped or proof of selected-cluster signal completeness.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "up{job=~\"serviceMonitor/monitoring/otel-collector/0|otel-collector\"}", "legendFormat": "collector"}], "fieldConfig": {"defaults": {"unit": "short"}}, "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0}},
        {"id": 2, "type": "timeseries", "title": "Controller reconciliation errors · manager-wide", "description": "Manager-wide controller-runtime errors. These have no ETOS cluster dimension and cannot identify which selected cluster is affected.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (controller) (rate(controller_runtime_reconcile_errors_total[5m]))", "legendFormat": "{{controller}}"}], "fieldConfig": {"defaults": {"unit": "errors/sec"}}, "gridPos": {"h": 8, "w": 16, "x": 0, "y": 5}},
        {"id": 3, "type": "table", "title": "Resource cleanup signals", "description": "Selected ETOS cluster's deleting and failed resource states from fresh manager-wide inventory. Unobserved combinations remain absent; stale inventory or absent cluster attribution is Unknown.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (resource_type,state) (etos_inventory_resources{scope=\"cluster\",state=~\"deleting|failed\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}", "format": "table"}], "fieldConfig": {"defaults": {"unit": "short", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 5}},
        {"id": 4, "type": "text", "title": "Provider operations", "options": {"mode": "markdown", "content": "**Unknown** — attempts, retries, and outcomes must be measured where the controller launches provider work. Removed the API creation proxy, which counted one TestRun three times."}, "gridPos": {"h": 8, "w": 16, "x": 0, "y": 13}},
        {"id": 5, "type": "timeseries", "title": "Provider provisioning p95 · 24h", "description": "Selected ETOS cluster's 24h p95 provider-invocation duration from Loki completion log attributes, by provider type and outcome. Exact canonical cluster attribution is required; old unqualified/unlabeled logs are excluded, not a cross-cluster fallback. Does not include preceding queue time or the entire EnvironmentRequest. Retries count as attempts. Empty is Unknown; crashes/startup failures may emit no observation. Samples depend on log delivery and backend retention.", "datasource": {"type": "loki", "uid": "loki"}, "targets": [{"refId": "A", "queryType": "range", "expr": "quantile_over_time(0.95, {service_name=~\"(Environment|Iut|LogArea|ExecutionSpace)/.+\"} | json event=\"attributes.event\", operation=\"attributes.operation\", outcome=\"attributes.outcome\", provider_type=\"attributes.providerType\", duration_seconds=\"attributes.duration_seconds\", etos_cluster=\"attributes.etos_cluster\" | etos_cluster=${cluster:doublequote} | etos_cluster!=\"\" | event=\"etos.provider.completed\" | operation=\"provision\" | unwrap duration_seconds | __error__=\"\" [24h]) by (provider_type, outcome)", "legendFormat": "{{provider_type}} / {{outcome}}"}], "fieldConfig": {"defaults": {"unit": "s", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 13}},
        {"id": 6, "type": "timeseries", "title": "Message publish rate by outcome", "description": "Selected cluster's bounded RabbitMQ publish lifecycle outcomes. Missing cluster attribution is Unknown. Event type, stream, message, TestRun, and error text are not metric dimensions.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (outcome) (rate(etos_message_publish_attempts_total{operation=\"publish\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))", "legendFormat": "{{outcome}}"}], "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 16, "x": 0, "y": 21}},
        {"id": 7, "type": "timeseries", "title": "Message publish p95", "description": "Selected cluster's publish lifecycle duration in seconds. Insufficient samples or missing cluster attribution remain Unknown.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "histogram_quantile(0.95, sum by (le, outcome) (rate(etos_message_publish_duration_seconds_bucket{operation=\"publish\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval])))", "legendFormat": "{{outcome}}"}], "fieldConfig": {"defaults": {"unit": "s", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 21}},
        {"id": 8, "type": "timeseries", "title": "SSE request rate", "description": "Selected cluster's bounded HTTP request rate from the SSE service. Missing canonical cluster attribution is Unknown. Route labels are templates and contain no identifiers.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (route, outcome) (rate(etos_sse_service_requests_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))", "legendFormat": "{{route}} / {{outcome}}"}], "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 16, "x": 0, "y": 29}},
        {"id": 9, "type": "stat", "title": "Active SSE connections", "description": "Selected cluster's current open SSE connections. Missing canonical cluster attribution or down/absent shared SSE scrape targets is Unknown; scrape gating is pipeline-wide.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(etos_sse_connections_active{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(up{job=~\".+-etos-sse\"}) == 1)", "legendFormat": "connections"}], "fieldConfig": {"defaults": {"unit": "short", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 29}},
        {"id": 10, "type": "timeseries", "title": "SSE event delivery", "description": "Selected cluster's bounded event classes delivered to clients. Missing cluster attribution is Unknown.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (event_class) (rate(etos_sse_events_delivered_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))", "legendFormat": "{{event_class}}"}], "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 16, "x": 0, "y": 37}},
        {"id": 20, "type": "timeseries", "title": "SSE disconnects and errors", "description": "Selected cluster's stream closure reasons and bounded errors. Missing cluster attribution is Unknown. This does not certify client receipt or replay completeness.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum by (reason) (rate(etos_sse_disconnects_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))", "legendFormat": "disconnect / {{reason}}"}, {"expr": "sum by (category) (rate(etos_sse_errors_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))", "legendFormat": "error / {{category}}"}], "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 16, "x": 0, "y": 77}},
        {"id": 21, "type": "timeseries", "title": "SSE reconnect intent", "description": "Selected cluster's requests carrying Last-Event-ID. Missing cluster attribution is Unknown. This is a reconnect signal, not proof that replay succeeded.", "datasource": {"type": "prometheus", "uid": "prometheus"}, "targets": [{"expr": "sum(rate(etos_sse_reconnects_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[$__rate_interval]))", "legendFormat": "reconnect requests"}], "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "Unknown"}}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 77}},
