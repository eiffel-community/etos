          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "none"
            }
          },
          "links": [
            {
              "title": "TestRun detail",
              "url": "/d/etos-testrun-detail?var-cluster=${cluster:percentencode}",
              "targetBlank": false
            }
          ],
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 16,
            "h": 12
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Active issues (up to 4)",
          "description": "Firing ETOS alerts for the selected cluster plus unlabeled manager/shared-pipeline alerts, grouped by alert name. Shared alerts can affect every cluster and are not cluster-specific evidence. Up to four names fit; all matching alerts affect the verdict. No active alerts is shown only with labeled selected-cluster inventory and manager readiness; otherwise UNKNOWN. This is not proof of signal completeness.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "topk(4, sum by (alertname) (ALERTS{alertstate=\"firing\",alertname=~\"ETOS.*\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"} or ALERTS{alertstate=\"firing\",alertname=~\"ETOS.*\",etos_cluster=\"\"})) or on() label_replace((0 * max(etos_inventory_testrun_overdue{scope=\"cluster\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}) and on() (min(etos_inventory_leader_ready) == 1) and on() etos_inventory_snapshot_ready{scope=\"manager\"}), \"alertname\", \"No active ETOS alerts\", \"\", \"\")",
              "refId": "A",
              "instant": true,
              "range": false,
              "legendFormat": "",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "alertname"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "alertname": "ETOS alert"
                }
              }
            }
