      "description": "Single-screen TV overview for the selected namespace/Cluster CR name. Domain metrics filter before aggregation; missing cluster labels mean UNKNOWN. Manager freshness, all API/controller scrapes, collector health and unlabeled shared alerts are infrastructure-wide, not selected-cluster certification. UNKNOWN outranks DEGRADED. Controller counts/quantiles are observations, not durable/backfilled ledgers. Failure rate uses failure|timed_out over finished outcomes except aborted, not test verdict. Open with kiosk mode for the wall display."
