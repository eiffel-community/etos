            "y": 13,
            "w": 4,
            "h": 6
          }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "API requests and server errors · last hour",
          "description": "Selected cluster's five-minute rates of canonical API operations across all API versions, not TestRun throughput. One shared zero-based requests/sec axis. Total requests use a solid blue line; 5xx uses a dashed line with points and direct legend labels. Down/absent shared API scrapes create gaps. A 5xx zero requires that cluster's labeled request-rate samples; missing cluster labels never produce a healthy zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(etos_api_requests_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])) and on() (min(up{job=~\".+-etos-api\"}) == 1)",
              "refId": "A",
              "instant": false,
              "range": true,
              "legendFormat": "API requests"
            },
            {
              "expr": "(sum(rate(etos_api_requests_total{status_class=\"5xx\",etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])) or on() (0 * sum(rate(etos_api_requests_total{etos_cluster=${cluster:doublequote},etos_cluster!=\"\"}[5m])))) and on() (min(up{job=~\".+-etos-api\"}) == 1)",
              "refId": "B",
              "instant": false,
              "range": true,
              "legendFormat": "Server errors (5xx)"
