apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: etos-sse
  namespace: monitoring
  labels:
    etos-observability: "true"
spec:
  namespaceSelector:
    matchNames:
      - etos-test
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-sample-etos-sse
      app.kubernetes.io/part-of: etos
      app.kubernetes.io/component: sse
  endpoints:
    - port: http
      path: /metrics/
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
