apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etos-health-provisional
  namespace: monitoring
  labels:
    etos-observability: "true"
spec:
  groups:
    - name: etos.health.provisional
      interval: 15s
      rules:
        - record: etos_collector_ready
          expr: ((min(up{job="otel-collector",endpoint="metrics"} and (time() - timestamp(up{job="otel-collector",endpoint="metrics"}) <= 30)) == bool 1) * (min(up{job="otel-collector",endpoint="int-metrics"} and (time() - timestamp(up{job="otel-collector",endpoint="int-metrics"}) <= 30)) == bool 1)) or on() vector(0)
        - record: etos_metric_overflow
          expr: count by (job, instance) ({__name__=~"etos_.*",otel_metric_overflow="true"} and (time() - timestamp({__name__=~"etos_.*",otel_metric_overflow="true"}) <= 120))
        - record: etos_inventory_fresh_leader
          expr: (etos_inventory_snapshot_ready_ratio{job="etos/etos-controller-manager",instance!="",scope="manager"} == 1) and on(job, instance) (time() - etos_inventory_snapshot_last_success_timestamp_seconds{job="etos/etos-controller-manager",instance!="",scope="manager"} <= 30) and (time() - timestamp(etos_inventory_snapshot_ready_ratio{job="etos/etos-controller-manager",instance!="",scope="manager"}) <= 30) and on() (etos_collector_ready == 1)
        - record: etos_inventory_leader_ready
          expr: ((count(etos_inventory_fresh_leader) == bool 1) unless on() etos_metric_overflow{job="etos/etos-controller-manager"}) or on() vector(0)
        - record: etos_inventory_current_resources
          expr: etos_inventory_resources_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_resources_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_phase
          expr: etos_inventory_testrun_phase_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_phase_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_verdict
          expr: etos_inventory_testrun_verdict_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_verdict_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_operational_conclusion
          expr: etos_inventory_testrun_operational_conclusion_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_operational_conclusion_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_created
          expr: etos_inventory_testrun_created_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_created_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_oldest_active_age_seconds
          expr: etos_inventory_testrun_oldest_active_age_seconds{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_oldest_active_age_seconds{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_overdue
          expr: etos_inventory_testrun_overdue_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_overdue_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_inventory_current_testrun_window_complete
          expr: etos_inventory_testrun_window_complete_ratio{job="etos/etos-controller-manager",scope="cluster"} and (time() - timestamp(etos_inventory_testrun_window_complete_ratio{job="etos/etos-controller-manager",scope="cluster"}) <= 30) and on(job, instance) etos_inventory_fresh_leader and on() (etos_inventory_leader_ready == 1)
        - record: etos_api_telemetry_fresh
          expr: max by (etos_cluster) (time() - timestamp(etos_api_requests_total{etos_cluster!=""}) <= bool 120) and on() (etos_collector_ready == 1)
        - record: etos_sse_telemetry_fresh
          expr: max by (etos_cluster) (time() - timestamp(etos_sse_service_requests_total{etos_cluster!=""}) <= bool 120) and on() (etos_collector_ready == 1)
        - alert: ETOSInventoryUnknown
          expr: absent(etos_inventory_leader_ready) or etos_inventory_leader_ready == 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS inventory is unknown
            description: Manager-wide, not ETOS-cluster scoped. No unique OTLP writer has a fresh complete inventory snapshot, or metric overflow was observed. Check leader election, OTLP delivery, source timestamps and inventory collection failures. Collector readiness alone does not establish manager liveness; missing occupancy is not zero.
        - alert: ETOSInventoryCollectionFailed
          expr: increase(etos_inventory_collection_failures_total{job="etos/etos-controller-manager",instance!="",scope="manager"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS inventory collection failed
            description: Manager-wide, not ETOS-cluster scoped. At least one manager-cache inventory snapshot failed in the last five minutes.
        - alert: ETOSAPI5xxObserved
          expr: sum by (etos_cluster) (rate(etos_api_requests_total{status_class="5xx",etos_cluster!=""}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS API server errors observed
            description: The API for ETOS cluster {{ $labels.etos_cluster }} emitted one or more 5xx responses during the evaluation window. Unlabeled legacy telemetry is not attributed to a cluster.
        - alert: ETOSCollectorSelfMetricsUnknown
          expr: absent(up{job="otel-collector",endpoint="int-metrics"}) or up{job="otel-collector",endpoint="int-metrics"} == 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS collector integrity metrics are unavailable
            description: Shared pipeline, not ETOS-cluster scoped. Collector accepted/exported point counters cannot be evaluated; downstream telemetry must be treated as Unknown.
        - alert: ETOSCollectorSpanExportFailure
          expr: increase(otelcol_exporter_send_failed_spans_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS collector span export failures observed
            description: Shared pipeline, not ETOS-cluster scoped. One or more spans failed to export from the collector; do not interpret missing downstream traces as zero.
        - alert: ETOSCollectorQueueBacklog
          expr: max(otelcol_exporter_queue_size) > 0
          for: 10m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS collector exporter queue is non-empty
            description: Shared pipeline, not ETOS-cluster scoped. Telemetry is queued at the collector for an extended interval; downstream freshness may be degraded.
        - alert: ETOSMetricCardinalityOverflow
          expr: etos_metric_overflow > 0
          for: 1m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS metric cardinality overflow observed
            description: A metric writer exceeded its attribute-set budget. Overflow loses cluster/outcome attribution; scoped totals and inventory are incomplete even if the Collector is healthy.
        - alert: ETOSCollectorMetricsUnknown
          expr: absent(up{job="otel-collector",endpoint="metrics"}) or up{job="otel-collector",endpoint="metrics"} == 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS OTLP metrics exporter is unavailable
            description: Shared Collector metrics endpoint is not being scraped successfully. This is pipeline evidence, not API/SSE service health.
        - alert: ETOSAPITelemetryUnknown
          expr: (group by (etos_cluster) (etos_inventory_current_resources{etos_cluster=~".+/.+"}) unless on(etos_cluster) (etos_api_telemetry_fresh == 1))
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS API telemetry is unavailable or stale
            description: Cluster {{ $labels.etos_cluster }} has fresh inventory but no recent attributed API request samples. Missing OTLP evidence is unknown, not proof of API failure.
        - alert: ETOSSSETelemetryUnknown
          expr: (group by (etos_cluster) (etos_inventory_current_resources{etos_cluster=~".+/.+"}) unless on(etos_cluster) (etos_sse_telemetry_fresh == 1))
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS SSE telemetry is unavailable or stale
            description: Cluster {{ $labels.etos_cluster }} has fresh inventory but no recent attributed SSE request samples. An idle or older service may emit no samples; client delivery is not inferred.
        - alert: ETOSMessagePublishFailure
          expr: sum by (etos_cluster) (rate(etos_message_publish_attempts_total{outcome!~"accepted|queued|confirmed",etos_cluster!=""}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS message publish failures observed
            description: Failed bounded message-publish attempts were observed for ETOS cluster {{ $labels.etos_cluster }}; broker delivery is not inferred from successful API admission. Unlabeled legacy telemetry is not attributed to a cluster.
        - alert: ETOSSuiteOperationFailure
          expr: sum by (etos_cluster) (rate(etos_api_suite_operations_total{outcome!="success",etos_cluster!=""}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS suite operation failures observed
            description: Suite download or validation failures were observed for ETOS cluster {{ $labels.etos_cluster }}; affected URLs and suite identifiers are intentionally excluded. Unlabeled legacy telemetry is not attributed to a cluster.
        - alert: ETOSTestRunOverdue
          expr: max by (etos_cluster) (etos_inventory_current_testrun_overdue{scope="cluster",etos_cluster!=""}) > 0
          for: 10m
          labels:
            severity: warning
            paging: "false"
          annotations:
            summary: ETOS TestRuns are past their deadline
            description: Fresh inventory for ETOS cluster {{ $labels.etos_cluster }} contains unfinished TestRuns past spec.deadline for ten minutes. Readiness is manager-wide. This provisional non-paging warning has no approved baseline or owner; inspect TestRun Detail and retained resource status.
